[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codepilot"
version = "0.1.0"
description = "An incremental, provider-neutral terminal coding agent"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp>=1.26,<2",
    "openai>=2,<3",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
codepilot = "codepilot.ui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "types-pyyaml>=6.0.12,<7",
    "types-jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

