# CodePilot 项目级默认配置。真实密钥只从 api_key_env 指定的环境变量读取。
provider:
  kind: openai-compatible
  model: qwen3.5-flash
  base_url: https://api.yunjintao.com/v1
  api_key_env: CODEPILOT_YJT_API_KEY
  api_key_file: ~/.config/codepilot/credentials.yaml
  max_tokens: 65536
  max_requests: 8
  timeout_seconds: 600

# Shell 和文件工具在用户级 Rootless Docker 中运行，避免直接执行在宿主机。
backend:
  kind: docker
  docker_image: codepilot-sandbox:0.1.0

# 编辑与 Shell 仍会进入终端审批，模型不能自行扩大权限。
permission: controlled-edit
scheduler_concurrency: 4

runtime:
  max_steps: 12
  max_tool_calls: 24
  timeout_seconds: 900
  max_consecutive_failures: 3

# 默认直接修改启动目录；需要并行隔离或补丁交付时再显式开启 worktree。
git_workspace:
  enabled: false
  base_commit: HEAD
  require_clean_source: false
  verification_command: []
  verification_timeout_seconds: 120
  max_patch_bytes: 16777216

# Qwen3.5-Flash 总上下文为 1M；为最大输出预留 65,536 Token。
context:
  max_prompt_tokens: 1000000
  response_reserve_tokens: 65536
  compact_trigger_tokens: 850000
  compact_target_tokens: 700000
  recent_rounds: 4

# 持久会话的保留与资源边界；正文属于私有资料，可显式查看和删除。
sessions:
  retention_days: 30
  command_output_bytes: 134217728
  task_output_bytes: 268435456
  session_output_bytes: 1073741824
  context_artifact_bytes: 33554432
  history_bytes: 16777216
  database_bytes: 67108864
  max_requests: 1000
